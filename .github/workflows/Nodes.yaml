name: Nodes
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nodes
  cancel-in-progress: false

jobs:
  cs-job:
    name: Collecting & Speedtest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Timezone
      run: sudo timedatectl set-timezone 'Asia/Shanghai'
    - name: requirements
      run: |
         pip install -r ./utils/pool/requirements.txt
         pip install -r ./utils/clashcheck/requirements.txt
    - name: etoneya
      run: cd ./utils/pool && python from_uri.py https://etoneya.baby/ etoneya.yaml || true
    - name: pool
      run: |
         cd ./utils/pool/
         timeout -k 30s 20m python main.py || test -s output.yaml
    - name: clashcheck
      run: |
         chmod +x ./utils/clashcheck/fetch-mihomo.sh
         if ./utils/clashcheck/fetch-mihomo.sh linux amd64; then
           cd ./utils/clashcheck/ && python main.py || test -s data/check.yaml
         else
           echo "fetch-mihomo failed; keeping previous check.yaml"
           test -s ./utils/clashcheck/data/check.yaml
         fi
    - name: upload pool
      uses: actions/upload-artifact@v4
      with:
        name: pool-output
        path: utils/pool/output.yaml
        if-no-files-found: error
    - name: upload alive
      uses: actions/upload-artifact@v4
      with:
        name: alive-proxies
        path: utils/clashcheck/data/check.yaml
        if-no-files-found: error

  rr-job:
    name: Remove & Remark
    needs: cs-job
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/download-artifact@v4
      with:
        name: alive-proxies
        path: utils/clashcheck/data
    - name: Timezone
      run: sudo timedatectl set-timezone 'Asia/Shanghai'
    - name: to-uri
      run: |
         pip install 'PyYAML~=6.0'
         python3 ./utils/pool/to_uri.py ./utils/clashcheck/data/check.yaml ./utils/rm/rm2
    - name: Remove & Remark
      run: |
         cd ./utils/rm/
         npm install || true
         npm start || true
    - name: url & https
      run: |
         chmod +x ./.github/url.sh
         if [ ! -s ./utils/rm/out ]; then
           echo "rm produced empty out; keeping checked-out url"
           test -s ./url
         else
           mv -f ./utils/rm/out ./url
         fi
         rm -f ./utils/rm/rm1 ./utils/rm/rm2
         test -s ./url
         base64 ./url -w 0 > ./utils/pool/check
         ./.github/url.sh > ./1
         cp ./url ./2
         cat 1 2 > 3 && rm 1 2
         base64 3 -w 0 > https && rm 3
    - name: upload subscription
      uses: actions/upload-artifact@v4
      with:
        name: subscription
        path: |
          url
          https
          .github/log
          utils/pool/check
        if-no-files-found: error

  et-job:
    name: Encode & Translate
    needs: rr-job
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        name: pool-output
        path: utils/pool
    - uses: actions/download-artifact@v4
      with:
        name: alive-proxies
        path: utils/clashcheck/data
    - uses: actions/download-artifact@v4
      with:
        name: subscription
        path: .
    - name: Timezone
      run: sudo timedatectl set-timezone 'Asia/Shanghai'
    - name: init
      run: |
         git config pull.rebase false
         git config --local user.name "GitHub Actions"
         git config --local user.email "actions@github.com"
    - name: subconverter
      run: |
         chmod +x ./utils/subconverter/fetch-extended.sh ./utils/subconverter/subconverter
         if ./utils/subconverter/fetch-extended.sh \
            && python3 ./utils/subconverter/feed.py clash ./url ./utils/subconverter/generate.ini \
            && (cd ./utils/subconverter && ./subconverter -g --artifact "clash" && test -f Clash.yaml); then
           mv -f ./utils/subconverter/Clash.yaml ./Clash.yaml
         else
           echo "subconverter failed; keeping previous Clash.yaml"
           test -s ./Clash.yaml
         fi
         rm -f ./utils/subconverter/rm1 ./utils/subconverter/nodes.txt
         test -s ./url
         base64 -w 0 ./url > ./long
    - name: push
      run: chmod +x ./.github/update-repo.sh && ./.github/update-repo.sh

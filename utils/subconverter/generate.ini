[clash]
path=Clash.yaml
target=clash
config=config/rule.ini
fdn=true
sort=true
udp=true
emoji=true
url=hysteria2://password@127.0.0.1:8443?sni=example.com#placeholder

[long]
path=long
target=mixed
url=hysteria2://password@127.0.0.1:8443?sni=example.com#placeholder

[rm]
path=rm1
target=mixed
url=hysteria2://password@127.0.0.1:8443?sni=example.com#placeholder

[newproto]
path=tests/newproto.out.yaml
target=clash
list=true
url=hysteria2://password@127.0.0.1:8443?sni=example.com&obfs=salamander&obfs-password=obfs#hy2-local|anytls://password@127.0.0.1:443?sni=example.com#anytls-local|vless://00000000-0000-0000-0000-000000000001@127.0.0.1:443?type=xhttp&security=tls&sni=example.com&path=/xhttp&mode=auto&host=example.com#xhttp-local|vless://00000000-0000-0000-0000-000000000002@127.0.0.1:443?type=ws&security=tls&sni=example.com&path=/&host=example.com#vless-ws-local

[newproto-mixed]
path=tests/newproto.mixed
target=mixed
url=hysteria2://password@127.0.0.1:8443?sni=example.com&obfs=salamander&obfs-password=obfs#hy2-local|anytls://password@127.0.0.1:443?sni=example.com#anytls-local|vless://00000000-0000-0000-0000-000000000001@127.0.0.1:443?type=xhttp&security=tls&sni=example.com&path=/xhttp&mode=auto&host=example.com#xhttp-local|vless://00000000-0000-0000-0000-000000000002@127.0.0.1:443?type=ws&security=tls&sni=example.com&path=/&host=example.com#vless-ws-local
